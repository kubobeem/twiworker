name = "twiworker"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# ======================================================
# 🗄️ KV 名前空間（レート制限）
# 新規作成: npx wrangler kv namespace create twiworker-kv
# ======================================================
# [[kv_namespaces]]
# binding = "KV"
# id = "<your-kv-namespace-id>"

# ======================================================
# 🗄️ D1 データベース（ツイートログ・スケジュール管理）
# 新規作成: npx wrangler d1 create twiworker-db
# ======================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "twiworker-db"
# database_id = "<your-d1-database-id>"

# ======================================================
# 🔑 シークレット変数（Pages Dashboard で設定）
# ======================================================
# TWITTER_COOKIES    : Twitter ログインクッキー（JSON文字列）
# ACCOUNT_USERNAME   : Twitter ユーザー名
