name = "twiworker"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# ======================================================
# 🗄️ KV 名前空間（Cookie保存・レート制限）
# ======================================================
[[kv_namespaces]]
binding = "KV"
id = "0e1ea9f295ed4f19a131a0fe44897e61"

# ======================================================
# 🗄️ D1 データベース（ツイートログ・スケジュール管理）
# ======================================================
[[d1_databases]]
binding = "DB"
database_name = "twiworker-db"
database_id = "320aa40b-239f-457c-b070-e4de0103ac6d"

# ======================================================
# 🔑 シークレット変数（Pages Dashboard で設定）
# ======================================================
# TWITTER_COOKIES    : Twitter ログインクッキー（JSON文字列）
# ACCOUNT_USERNAME   : Twitter ユーザー名
